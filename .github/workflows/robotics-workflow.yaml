name: "[Robotics] CI"

on:
  pull_request:
    paths:
      - '.github/workflows/robotics*'
      - 'src/components/**'
      - '!src/components/**/docs/**'

  push:
    paths:
      - '.github/workflows/robotics*'
      - 'src/components/**'
      - '!src/components/**/docs/**'
    branches:
      - main
      - release-*

  workflow_dispatch:
    inputs:
      rebuild-all:
        description: 'Run checks for every component'
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  build-components:
    name: "Build (AMR)"
    uses: "./.github/workflows/robotics-components.yaml"
    with:
      rebuild-all: ${{ inputs.rebuild-all || false }}

